<!-- @dsCard group="Components" name="Cards" subtitle="Raised surface, header + form + list-row zones" -->
<title>Cards</title>
<style>
  :root { --background:#fafafa; --foreground:#18181b; --surface:#ffffff; --border:#e4e4e7; --muted:#71717a; --faint:#a1a1aa; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#09090b; --foreground:#fafafa; --surface:#18181b; --border:#27272a; --muted:#a1a1aa; --faint:#71717a; --accent:#6366f1; }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; }
  .card { border-radius:0.75rem; border:1px solid var(--border); background:var(--surface); box-shadow:0 1px 2px rgb(0 0 0 / 0.05); max-width:560px; margin-bottom:1.25rem; }
  .card-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding:12px 16px; }
  .card-header h2 { margin:0; font-size:14px; font-weight:600; }
  .card-header .count { font-size:12px; color:var(--faint); }
  .card-body { padding:12px 16px; }
  .rows { padding:0 16px; }
  .rows > div { padding:10px 0; }
  .rows > div + div { border-top:1px solid var(--border); }
</style>
<div class="card">
  <div class="card-header"><h2>Career &amp; Work</h2><span class="count">2 open</span></div>
  <div class="rows">
    <div>Ship the design system</div>
    <div>Review intern PRs</div>
  </div>
</div>
<div class="card">
  <div class="card-body" style="color:var(--muted)">Plain card — used for forms (p-5) and empty content.</div>
</div>
