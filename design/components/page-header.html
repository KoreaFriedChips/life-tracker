<!-- @dsCard group="Components" name="Page header" subtitle="text-xl title + right-aligned actions, optional back link + badge row" -->
<title>Page header</title>
<style>
  :root { --background:#fcfcfd; --foreground:#1c1d21; --surface:#ffffff; --surface-subtle:#f4f5f8; --surface-raised:#ffffff; --border:#e9eaf0; --border-strong:#d9dbe4; --muted:#6b6f80; --faint:#9b9fb0; --accent:#5e6ad2; --accent-hover:#5158bb; --accent-soft:#eef0fb; --accent-soft-fg:#4a51ad; --danger:#d5453c; --danger-soft:#fdf0ef; --danger-soft-fg:#b03a32; --success-soft:#eefaf2; --success-soft-fg:#1a7f46; --warning-soft:#fdf6e8; --warning-soft-fg:#a16207; --ring:color-mix(in srgb, var(--accent) 55%, transparent); --sh-xs:0 1px 2px rgba(16,17,20,0.04); --sh-card:0 1px 2px rgba(16,17,20,0.04), 0 2px 8px -2px rgba(16,17,20,0.06); --sh-pop:0 4px 16px -4px rgba(16,17,20,0.16), 0 1px 3px rgba(16,17,20,0.08); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(78,87,190,0.35); --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#0b0c0e; --foreground:#eeeff2; --surface:#16171b; --surface-subtle:#1f2126; --surface-raised:#191a1f; --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14); --muted:#9a9ea9; --faint:#62666f; --accent:#6e79d6; --accent-hover:#828cdf; --accent-soft:rgba(110,121,214,0.16); --accent-soft-fg:#a5ade8; --danger:#ec5f57; --danger-soft:rgba(236,95,87,0.14); --danger-soft-fg:#f2938d; --success-soft:rgba(63,185,111,0.14); --success-soft-fg:#6fd396; --warning-soft:rgba(245,184,73,0.14); --warning-soft-fg:#e8b04b; --ring:color-mix(in srgb, var(--accent) 60%, transparent); --sh-xs:0 0 0 1px rgba(255,255,255,0.02); --sh-card:0 0 0 1px rgba(255,255,255,0.02); --sh-pop:0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 0 12px rgba(94,106,210,0.25); }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; letter-spacing:-0.006em; }
  .header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; max-width:560px; margin-bottom:2rem; }
  h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-0.02em; }
  .actions { display:flex; gap:8px; flex-shrink:0; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-md); font-weight:500; cursor:pointer; font-family:inherit; letter-spacing:inherit; height:32px; padding:0 14px; font-size:14px; border:none; text-decoration:none; transition:background-color .15s, border-color .15s; }
  .btn.primary { background:var(--accent); color:#fff; box-shadow:var(--sh-btn-primary); }
  .btn.primary:hover { background:var(--accent-hover); }
  .btn.secondary { background:var(--surface); color:var(--foreground); border:1px solid var(--border); box-shadow:var(--sh-xs); }
  .btn.secondary:hover { background:var(--surface-subtle); border-color:var(--border-strong); }
  .back { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:500; color:var(--muted); text-decoration:none; margin-bottom:6px; transition:color .15s; }
  .back:hover { color:var(--foreground); }
  .badges { display:flex; gap:6px; margin-top:8px; }
  .badge { display:inline-flex; align-items:center; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:500; white-space:nowrap; border:1px solid color-mix(in srgb, currentColor 10%, transparent); }
  .tag { background:var(--surface-subtle); color:var(--muted); font-weight:400; }
</style>
<div class="header">
  <h1>Knowledge</h1>
  <div class="actions">
    <a class="btn secondary" href="#">View graph</a>
    <a class="btn primary" href="#">Add entry</a>
  </div>
</div>
<div class="header">
  <div>
    <a class="back" href="#">&#8592; People</a>
    <h1>Alice Contacted</h1>
    <div class="badges">
      <span class="badge tag">friend</span>
      <span class="badge tag">college</span>
    </div>
  </div>
  <div class="actions">
    <a class="btn secondary" href="#">Edit</a>
  </div>
</div>
