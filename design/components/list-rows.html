<!-- @dsCard group="Components" name="List rows" subtitle="To-do, person, knowledge rows — full-row hover, edge-to-edge bands" -->
<title>List rows</title>
<style>
  :root { --background:#fcfcfd; --foreground:#1c1d21; --surface:#ffffff; --surface-subtle:#f4f5f8; --surface-raised:#ffffff; --border:#e9eaf0; --border-strong:#d9dbe4; --muted:#6b6f80; --faint:#9b9fb0; --accent:#5e6ad2; --accent-hover:#5158bb; --accent-soft:#eef0fb; --accent-soft-fg:#4a51ad; --danger:#d5453c; --danger-soft:#fdf0ef; --danger-soft-fg:#b03a32; --success-soft:#eefaf2; --success-soft-fg:#1a7f46; --warning-soft:#fdf6e8; --warning-soft-fg:#a16207; --ring:color-mix(in srgb, var(--accent) 55%, transparent); --sh-xs:0 1px 2px rgba(16,17,20,0.04); --sh-card:0 1px 2px rgba(16,17,20,0.04), 0 2px 8px -2px rgba(16,17,20,0.06); --sh-pop:0 4px 16px -4px rgba(16,17,20,0.16), 0 1px 3px rgba(16,17,20,0.08); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(78,87,190,0.35); --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#0b0c0e; --foreground:#eeeff2; --surface:#16171b; --surface-subtle:#1f2126; --surface-raised:#191a1f; --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14); --muted:#9a9ea9; --faint:#62666f; --accent:#6e79d6; --accent-hover:#828cdf; --accent-soft:rgba(110,121,214,0.16); --accent-soft-fg:#a5ade8; --danger:#ec5f57; --danger-soft:rgba(236,95,87,0.14); --danger-soft-fg:#f2938d; --success-soft:rgba(63,185,111,0.14); --success-soft-fg:#6fd396; --warning-soft:rgba(245,184,73,0.14); --warning-soft-fg:#e8b04b; --ring:color-mix(in srgb, var(--accent) 60%, transparent); --sh-xs:0 0 0 1px rgba(255,255,255,0.02); --sh-card:0 0 0 1px rgba(255,255,255,0.02); --sh-pop:0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 0 12px rgba(94,106,210,0.25); }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; letter-spacing:-0.006em; }
  .card { border-radius:var(--radius-lg); border:1px solid var(--border); background:var(--surface); box-shadow:var(--sh-card); max-width:560px; overflow:hidden; }
  .rows { padding:0 16px; }
  .row { display:flex; align-items:flex-start; gap:12px; padding:10px 16px; margin:0 -16px; transition:background-color .15s; }
  .row + .row { border-top:1px solid var(--border); }
  .row.hoverable:hover, .row.hovered { background:var(--surface-subtle); cursor:pointer; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:500; white-space:nowrap; border:1px solid color-mix(in srgb, currentColor 10%, transparent); }
  .badge .dot { width:6px; height:6px; border-radius:999px; background:currentColor; }
  .tag { background:var(--surface-subtle); color:var(--muted); font-weight:400; }
  .title { font-weight:500; }
  .notes { font-size:12px; color:var(--muted); margin-top:2px; }
  .spread { display:flex; justify-content:space-between; align-items:center; flex:1; gap:8px; flex-wrap:wrap; }
  input[type="checkbox"] { width:16px; height:16px; margin-top:2px; accent-color:var(--accent); }
</style>
<div class="card">
  <div class="rows">
    <div class="row">
      <input type="checkbox">
      <div><span>Book flights for the trip</span> <span class="badge" style="background:var(--danger-soft);color:var(--danger-soft-fg)">overdue · 2026-08-01</span>
        <div class="notes">Check points balance first</div>
      </div>
    </div>
    <div class="row hoverable hovered">
      <div class="spread">
        <span><span class="title">Alice Contacted</span> <span class="badge tag">friend</span></span>
        <span class="badge" style="background:var(--success-soft);color:var(--success-soft-fg)"><span class="dot"></span>9d ago</span>
      </div>
    </div>
    <div class="row hoverable">
      <span class="title" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Thinking, Fast and Slow</span>
      <span class="badge tag">book</span>
      <span class="badge" style="background:var(--accent-soft);color:var(--accent-soft-fg)">reading</span>
      <span class="badge tag">psychology</span>
    </div>
  </div>
</div>
<p style="font-size:11px;color:var(--faint);margin-top:0.75rem">Second row shown in its hover state — full-row bands bleed edge-to-edge, whole row is the link target.</p>
