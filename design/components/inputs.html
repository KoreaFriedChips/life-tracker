<!-- @dsCard group="Components" name="Form fields" subtitle="Input / select / textarea, labeled fields" -->
<title>Form fields</title>
<style>
  :root { --background:#fafafa; --foreground:#18181b; --surface:#ffffff; --border:#e4e4e7; --muted:#71717a; --faint:#a1a1aa; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#09090b; --foreground:#fafafa; --surface:#18181b; --border:#27272a; --muted:#a1a1aa; --faint:#71717a; --accent:#6366f1; }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; }
  .control { height:36px; box-sizing:border-box; border-radius:0.5rem; border:1px solid var(--border); background:var(--surface); color:var(--foreground); padding:0 12px; font-size:14px; font-family:inherit; outline:none; }
  .control:focus { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
  .control::placeholder { color:var(--faint); }
  textarea.control { height:auto; padding:8px 12px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:1rem; max-width:360px; }
  .field > span { font-size:12px; font-weight:500; color:var(--muted); }
</style>
<label class="field"><span>Title</span><input class="control" placeholder="Placeholder text"></label>
<label class="field"><span>Status</span>
  <select class="control"><option>Want to read</option><option>Reading</option><option>Finished</option></select>
</label>
<label class="field"><span>Notes</span><textarea class="control" rows="3" placeholder="Markdown supported"></textarea></label>
