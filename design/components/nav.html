<!-- @dsCard group="Components" name="Navigation" subtitle="Sticky top bar — accent underline active state; mobile: LT monogram + scrollable links" -->
<title>Navigation</title>
<style>
  :root { --background:#fcfcfd; --foreground:#1c1d21; --surface:#ffffff; --surface-subtle:#f4f5f8; --surface-raised:#ffffff; --border:#e9eaf0; --border-strong:#d9dbe4; --muted:#6b6f80; --faint:#9b9fb0; --accent:#5e6ad2; --accent-hover:#5158bb; --accent-soft:#eef0fb; --accent-soft-fg:#4a51ad; --danger:#d5453c; --danger-soft:#fdf0ef; --danger-soft-fg:#b03a32; --success-soft:#eefaf2; --success-soft-fg:#1a7f46; --warning-soft:#fdf6e8; --warning-soft-fg:#a16207; --ring:color-mix(in srgb, var(--accent) 55%, transparent); --sh-xs:0 1px 2px rgba(16,17,20,0.04); --sh-card:0 1px 2px rgba(16,17,20,0.04), 0 2px 8px -2px rgba(16,17,20,0.06); --sh-pop:0 4px 16px -4px rgba(16,17,20,0.16), 0 1px 3px rgba(16,17,20,0.08); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(78,87,190,0.35); --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#0b0c0e; --foreground:#eeeff2; --surface:#16171b; --surface-subtle:#1f2126; --surface-raised:#191a1f; --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14); --muted:#9a9ea9; --faint:#62666f; --accent:#6e79d6; --accent-hover:#828cdf; --accent-soft:rgba(110,121,214,0.16); --accent-soft-fg:#a5ade8; --danger:#ec5f57; --danger-soft:rgba(236,95,87,0.14); --danger-soft-fg:#f2938d; --success-soft:rgba(63,185,111,0.14); --success-soft-fg:#6fd396; --warning-soft:rgba(245,184,73,0.14); --warning-soft-fg:#e8b04b; --ring:color-mix(in srgb, var(--accent) 60%, transparent); --sh-xs:0 0 0 1px rgba(255,255,255,0.02); --sh-card:0 0 0 1px rgba(255,255,255,0.02); --sh-pop:0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 0 12px rgba(94,106,210,0.25); }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; letter-spacing:-0.006em; }
  .frame { border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:1.25rem; background:var(--background); }
  .bar { display:flex; align-items:center; gap:20px; border-bottom:1px solid var(--border); padding:0 16px; height:44px; background:color-mix(in srgb, var(--background) 80%, transparent); }
  .brand { font-size:14px; font-weight:600; letter-spacing:-0.01em; text-decoration:none; color:var(--foreground); white-space:nowrap; }
  .links { display:flex; gap:4px; align-items:stretch; height:100%; overflow-x:auto; scrollbar-width:none; }
  .links::-webkit-scrollbar { display:none; }
  .link { position:relative; display:flex; align-items:center; padding:0 10px; font-size:14px; color:var(--muted); text-decoration:none; transition:color .15s; white-space:nowrap; }
  .link:hover { color:var(--foreground); }
  .link.active { color:var(--foreground); font-weight:500; }
  .link.active::after { content:""; position:absolute; left:10px; right:10px; bottom:-1px; height:2px; border-radius:1px; background:var(--accent); }
  .logout { margin-left:auto; font-size:14px; color:var(--muted); background:none; border:none; cursor:pointer; font-family:inherit; padding:6px 10px; border-radius:var(--radius-md); transition:background-color .15s, color .15s; }
  .logout:hover { background:var(--surface-subtle); color:var(--foreground); }
  .label { font-size:11px; color:var(--faint); margin-bottom:0.5rem; }
  .mobile { max-width:375px; }
  .content-hint { padding:16px; font-size:12px; color:var(--faint); }
</style>
<div class="label">Desktop (≥ sm) — sticky, backdrop-blur, active link gets the accent underline</div>
<div class="frame">
  <div class="bar">
    <a class="brand" href="#">Life Tracker</a>
    <nav class="links">
      <a class="link active" href="#">To-dos</a>
      <a class="link" href="#">Calendar</a>
      <a class="link" href="#">People</a>
      <a class="link" href="#">Knowledge</a>
    </nav>
    <button class="logout">Log out</button>
  </div>
  <div class="content-hint">page content…</div>
</div>
<div class="label">Mobile (&lt; sm, 375px) — brand collapses to LT monogram, links scroll horizontally, no hamburger</div>
<div class="frame mobile">
  <div class="bar" style="gap:12px; padding:0 12px;">
    <a class="brand" href="#">LT</a>
    <nav class="links">
      <a class="link active" href="#">To-dos</a>
      <a class="link" href="#">Calendar</a>
      <a class="link" href="#">People</a>
      <a class="link" href="#">Knowledge</a>
    </nav>
    <button class="logout">Log out</button>
  </div>
  <div class="content-hint">page content…</div>
</div>
