<!-- @dsCard group="Colors" name="Color tokens" subtitle="Linear-style semantic palette + elevation, light + dark via prefers-color-scheme" -->
<title>Color tokens</title>
<style>
  :root { --background:#fcfcfd; --foreground:#1c1d21; --surface:#ffffff; --surface-subtle:#f4f5f8; --surface-raised:#ffffff; --border:#e9eaf0; --border-strong:#d9dbe4; --muted:#6b6f80; --faint:#9b9fb0; --accent:#5e6ad2; --accent-hover:#5158bb; --accent-soft:#eef0fb; --accent-soft-fg:#4a51ad; --danger:#d5453c; --danger-soft:#fdf0ef; --danger-soft-fg:#b03a32; --success-soft:#eefaf2; --success-soft-fg:#1a7f46; --warning-soft:#fdf6e8; --warning-soft-fg:#a16207; --ring:color-mix(in srgb, var(--accent) 55%, transparent); --sh-xs:0 1px 2px rgba(16,17,20,0.04); --sh-card:0 1px 2px rgba(16,17,20,0.04), 0 2px 8px -2px rgba(16,17,20,0.06); --sh-pop:0 4px 16px -4px rgba(16,17,20,0.16), 0 1px 3px rgba(16,17,20,0.08); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(78,87,190,0.35); --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; }
  @media (prefers-color-scheme: dark) {
    :root { --background:#0b0c0e; --foreground:#eeeff2; --surface:#16171b; --surface-subtle:#1f2126; --surface-raised:#191a1f; --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14); --muted:#9a9ea9; --faint:#62666f; --accent:#6e79d6; --accent-hover:#828cdf; --accent-soft:rgba(110,121,214,0.16); --accent-soft-fg:#a5ade8; --danger:#ec5f57; --danger-soft:rgba(236,95,87,0.14); --danger-soft-fg:#f2938d; --success-soft:rgba(63,185,111,0.14); --success-soft-fg:#6fd396; --warning-soft:rgba(245,184,73,0.14); --warning-soft-fg:#e8b04b; --ring:color-mix(in srgb, var(--accent) 60%, transparent); --sh-xs:0 0 0 1px rgba(255,255,255,0.02); --sh-card:0 0 0 1px rgba(255,255,255,0.02); --sh-pop:0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04); --sh-btn-primary:inset 0 1px 0 rgba(255,255,255,0.14), 0 0 12px rgba(94,106,210,0.25); }
  }
  body { margin:0; padding:1.5rem; background:var(--background); color:var(--foreground); font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-size:14px; letter-spacing:-0.006em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.75rem; margin-bottom:1.5rem; }
  .swatch { border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; background:var(--surface); }
  .swatch .chip { height:48px; }
  .swatch .label { padding:0.4rem 0.6rem; font-size:11px; color:var(--muted); }
  .section { font-size:11px; font-weight:500; color:var(--faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:0.6rem; }
  .shadows { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:1rem; }
  .shadow-chip { height:64px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); }
</style>
<div class="section">Surfaces &amp; text</div>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:var(--background)"></div><div class="label">background</div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface)"></div><div class="label">surface</div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface-subtle)"></div><div class="label">surface-subtle</div></div>
  <div class="swatch"><div class="chip" style="background:var(--surface-raised)"></div><div class="label">surface-raised</div></div>
  <div class="swatch"><div class="chip" style="background:var(--border)"></div><div class="label">border</div></div>
  <div class="swatch"><div class="chip" style="background:var(--border-strong)"></div><div class="label">border-strong</div></div>
  <div class="swatch"><div class="chip" style="background:var(--foreground)"></div><div class="label">foreground</div></div>
  <div class="swatch"><div class="chip" style="background:var(--muted)"></div><div class="label">muted</div></div>
  <div class="swatch"><div class="chip" style="background:var(--faint)"></div><div class="label">faint</div></div>
</div>
<div class="section">Accent &amp; tones</div>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:var(--accent)"></div><div class="label">accent</div></div>
  <div class="swatch"><div class="chip" style="background:var(--accent-hover)"></div><div class="label">accent-hover</div></div>
  <div class="swatch"><div class="chip" style="background:var(--accent-soft)"></div><div class="label">accent-soft</div></div>
  <div class="swatch"><div class="chip" style="background:var(--danger)"></div><div class="label">danger</div></div>
  <div class="swatch"><div class="chip" style="background:var(--danger-soft)"></div><div class="label">danger-soft</div></div>
  <div class="swatch"><div class="chip" style="background:var(--success-soft)"></div><div class="label">success-soft</div></div>
  <div class="swatch"><div class="chip" style="background:var(--warning-soft)"></div><div class="label">warning-soft</div></div>
</div>
<div class="section">Elevation (dark theme swaps shadows for border/surface deltas)</div>
<div class="shadows">
  <div class="shadow-chip" style="box-shadow:var(--sh-xs)">sh-xs</div>
  <div class="shadow-chip" style="box-shadow:var(--sh-card)">sh-card</div>
  <div class="shadow-chip" style="box-shadow:var(--sh-pop)">sh-pop</div>
  <div class="shadow-chip" style="background:var(--accent); color:#fff; border:none; box-shadow:var(--sh-btn-primary)">sh-btn-primary</div>
</div>
